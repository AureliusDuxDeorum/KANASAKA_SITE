<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | KANASAKA</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/Tektur-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css?v=114">
  <link rel="stylesheet" href="/assets/css/redesign.css?v=91">
  <script defer src="/assets/js/password-policy.js?v=88"></script>
  <script defer src="/assets/js/auth.js?v=95"></script>
  <script defer src="/assets/js/main.js?v=109"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<div id="site-header"></div>

<main id="main-content">

  <section class="auth-page">
    <div class="auth-page-backdrop" aria-hidden="true"></div>

    <div class="auth-card auth-card--modern">
      <div class="auth-card-accent" aria-hidden="true"></div>
      <div class="auth-card-body">

      <form id="reset-password-form" class="auth-form">
        <div class="auth-modal-step" data-step="email">
          <p class="auth-eyebrow">Account &middot; Step 1 of 3</p>
          <h1>Reset Password</h1>
          <p class="auth-lead">Confirm the email you're resetting.</p>
          <div class="auth-field">
            <label for="reset-email">Email</label>
            <input id="reset-email" name="email" type="email" autocomplete="email" required>
          </div>
          <button type="button" class="button auth-submit" data-action="next">Continue</button>
        </div>

        <div class="auth-modal-step" data-step="code" hidden>
          <p class="auth-eyebrow">Account &middot; Step 2 of 3</p>
          <h1>Reset Password</h1>
          <p class="auth-lead">Enter the 6-digit code we emailed you.</p>
          <div class="auth-field">
            <label id="reset-code-label">Verification code</label>
            <div class="otp-boxes" id="reset-code-boxes" role="group" aria-labelledby="reset-code-label"></div>
            <input type="hidden" id="reset-code" name="code">
          </div>
          <button type="button" class="button auth-submit" data-action="next">Continue</button>
          <p class="auth-switch"><button type="button" class="link-button" data-action="back">Back</button> &middot; <button id="reset-resend" class="link-button" type="button">Resend code</button></p>
        </div>

        <div class="auth-modal-step" data-step="password" hidden>
          <p class="auth-eyebrow">Account &middot; Step 3 of 3</p>
          <h1>Reset Password</h1>
          <p class="auth-lead">Choose a new password.</p>
          <div class="auth-field">
            <label for="reset-password">New Password</label>
            <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
            <ul id="reset-password-policy" class="password-policy" aria-live="polite"></ul>
          </div>
          <button class="button auth-submit" type="submit">Update Password</button>
          <p class="auth-switch"><button type="button" class="link-button" data-action="back">Back</button></p>
        </div>
      </form>

      <div class="auth-footer">
        <p class="auth-switch"><a href="/login/">Back to log in</a></p>
      </div>
      </div>
    </div>


  </section>


</main>

<div id="site-footer"></div>

</body>
</html>
