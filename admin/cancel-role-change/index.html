<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Role Change | KANASAKA</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/Tektur-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css?v=82">
  <link rel="stylesheet" href="/assets/css/redesign.css?v=82">
  <script defer src="/assets/js/auth.js?v=82"></script>
  <script defer src="/assets/js/main.js?v=82"></script>
</head>
<body>

<div id="site-header"></div>

<main>

  <section class="auth-page">
    <div class="auth-page-backdrop" aria-hidden="true"></div>

    <div class="auth-card auth-card--modern auth-card-elevated">
      <div class="auth-card-accent" aria-hidden="true"></div>
      <div class="auth-card-body">

      <p class="auth-eyebrow">Account</p>
      <h1>Role Change</h1>
      <p id="cancel-role-status" class="auth-lead">Checking this link...</p>

      </div>
    </div>

  </section>

</main>

<div id="site-footer"></div>

<script>
  (function () {
    document.addEventListener("DOMContentLoaded", async function () {
      const status = document.getElementById("cancel-role-status");
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      if (!token) {
        status.textContent = "This link is missing its token.";
        return;
      }

      try {
        const response = await fetch("/api/admin/cancel-role-change?token=" + encodeURIComponent(token), {
          method: "GET",
          credentials: "include",
        });
        const data = await response.json();
        status.textContent = (data && data.message) || "Something went wrong.";
      } catch {
        status.textContent = "Could not reach the server. Try again shortly.";
      }
    });
  })();
</script>

</body>
</html>
