name = "kanasaka-site"
compatibility_date = "2024-11-12"
pages_build_output_dir = "."

# D1 migrations (run in order on remote):
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/003_profile.sql
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/004_security.sql
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/005_auth_hardening.sql
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/006_repair_token_schema.sql
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/008_security_hardening.sql
# R2 installers bucket (create in dashboard, bind in Pages as INSTALLERS):
#   bucket_name = kanasaka-installers
# Upload installers:
#   node scripts/upload-installers-r2.mjs
# Optional Argon2 tuning (Pages → Variables):
#   ARGON2_MEMORY_KIB = 19456
#   ARGON2_ITERATIONS = 3
# WAF audit:
#   node scripts/check-waf-rules.mjs
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/014_ks_stocks_subscription.sql
# Live Stripe:
#   Secrets (Pages → Settings → Variables and secrets → Production):
#     STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#   Price IDs ([vars] below — also set in Production if not deploying via wrangler.toml):
#     STRIPE_PRICE_KS_PACKAGE_MONTHLY, STRIPE_PRICE_KS_PACKAGE_ANNUAL
# Stripe Dashboard (Live mode):
#   Product: KS_Package — €10/month + €100/year recurring prices
#   Customer Portal: enabled
#   Webhook: https://kanasaka.com/api/stripe/webhook
#     events: checkout.session.completed, customer.subscription.created,
#             customer.subscription.updated, customer.subscription.deleted
# Developer account @ks_dev gets permanent KS Stocks access (no subscription).

[[r2_buckets]]
binding = "INSTALLERS"
bucket_name = "kanasaka-installers"

[[d1_databases]]
binding = "DB"
database_name = "kanasaka-auth"
database_id = "b76e77d3-4056-4ba2-8356-c69fb65a13d9"

[vars]
SESSION_DAYS = "30"
SITE_URL = "https://kanasaka.com"
FROM_EMAIL = "noreply@kanasaka.com"
FROM_NAME = "KANASAKA"
ARGON2_MEMORY_KIB = "19456"
ARGON2_ITERATIONS = "3"
STRIPE_PRICE_KS_PACKAGE_MONTHLY = "price_1U6xQ53dTvPYganN71RV2vMs"
STRIPE_PRICE_KS_PACKAGE_ANNUAL = "price_1U6xQ53dTvPYganNsiScSPC0"
