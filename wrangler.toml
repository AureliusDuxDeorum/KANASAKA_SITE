name = "kanasaka-site"
compatibility_date = "2024-11-12"
pages_build_output_dir = "."

# D1 migrations: files in migrations/ run in filename order. 007, 012 (wipes) and the *_repair
# files are one-offs, not part of a fresh setup. Apply a single one to the remote database with:
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/<NNN_name>.sql
# schema.sql is only the original 001 baseline; tests build their database from schema.sql plus
# every migration, so production state = baseline + migrations/*.sql.
# 022_throttle_indexes.sql adds the indexes behind the auth_events throttles (safe to re-run).
# R2 installers bucket (create in dashboard, bind in Pages as INSTALLERS):
#   bucket_name = kanasaka-installers
# Upload installers:
#   node scripts/upload-installers-r2.mjs
# Optional Argon2 tuning (Pages → Variables):
#   ARGON2_MEMORY_KIB = 19456
#   ARGON2_ITERATIONS = 3
# WAF audit:
#   node scripts/check-waf-rules.mjs
# Legal notice system (publish a policy update, email + in-app banner):
#   npx wrangler d1 execute kanasaka-auth --remote --file=./migrations/017_legal_notices.sql
#   see docs/LEGAL_NOTICES.md
# Developer admin @dev_ks gets permanent full access.

[[r2_buckets]]
binding = "INSTALLERS"
bucket_name = "kanasaka-installers"

[[d1_databases]]
binding = "DB"
database_name = "kanasaka-auth"
database_id = "b76e77d3-4056-4ba2-8356-c69fb65a13d9"

[vars]
SESSION_DAYS = "30"
SITE_URL = "https://kanasaka.com"
FROM_EMAIL = "noreply@kanasaka.com"
FROM_NAME = "KANASAKA"
ARGON2_MEMORY_KIB = "19456"
ARGON2_ITERATIONS = "3"
